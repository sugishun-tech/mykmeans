name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', sklearn: 'scikit-learn==1.6.*', openmp: '1'}
          - {os: ubuntu-latest, python: '3.12', sklearn: 'scikit-learn', openmp: '1'}
          - {os: ubuntu-latest, python: '3.12', sklearn: 'scikit-learn', openmp: '0'}
          - {os: macos-latest, python: '3.12', sklearn: 'scikit-learn', openmp: '0'}
          - {os: windows-latest, python: '3.12', sklearn: 'scikit-learn', openmp: '1'}
    runs-on: ${{ matrix.os }}
    env:
      MYKMEANS_OPENMP: ${{ matrix.openmp }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "${{ matrix.sklearn }}" ".[test]"
      - run: python -m pytest
      - run: python examples/basic.py
      - run: python examples/research.py
      - run: python examples/sklearn_integration.py
  standalone:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -c "import importlib.util; assert importlib.util.find_spec('sklearn') is None"
      - run: python examples/basic.py
      - run: python examples/research.py
