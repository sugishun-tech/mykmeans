[build-system]
requires = ["setuptools>=77", "wheel", "Cython>=3.0,<4", "numpy>=1.26", "scipy>=1.11"]
build-backend = "setuptools.build_meta"

[project]
name = "mykmeans"
version = "0.2.0"
description = "Cython/OpenMP k-means with a scikit-learn API and mathematical diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "mykmeans contributors"}]
keywords = ["kmeans", "clustering", "cython", "openmp", "hamerly"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Cython",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.26", "scipy>=1.11", "threadpoolctl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8", "pandas>=2", "scikit-learn>=1.6,<2"]
dev = ["pytest>=8", "pandas>=2", "scikit-learn>=1.6,<2", "build>=1.2", "Cython>=3.0,<4"]
sklearn = ["scikit-learn>=1.6,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mykmeans = ["*.pyx", "*.h", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::RuntimeWarning:mykmeans.*"]
